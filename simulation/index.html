<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулация на Махало</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
          "imports": {
            "three": "./three.js-master/build/three.module.js",
            "three/addons/": "./three.js-master/examples/jsm/",
            "OrbitControls": "./three.js-master/examples/jsm/controls/OrbitControls.js"
          }
        }
    </script>
</head>
<body>
    <div class="header">
        <h1>Симулация на Математично Махало</h1>
    </div>
    <div class="simulation-container">
        <div class="controls-panel">
            <div class="controls-content">
                <div class="controls-section">
                    <h2>Параметри на махалото</h2>
                    <div class="control-group">
                        <label for="mass-slider">Маса на топчето (kg):</label>
                        <div class="slider-container">
                            <input type="range" id="mass-slider" min="0.01" max="2" step="0.01" value="0.2">
                            <input type="number" id="mass-input" min="0.01" max="2" step="0.01" value="0.2" class="value-input">
                        </div>
                    </div>
                    <div class="control-group">
                        <label for="length-slider">Дължина на нишката (m):</label>
                        <div class="slider-container">
                            <input type="range" id="length-slider" min="0.5" max="2" step="0.01" value="1.1">
                            <input type="number" id="length-input" min="0.5" max="2" step="0.01" value="1.1" class="value-input">
                        </div>
                    </div>
                    <div class="control-group">
                        <label for="angle-slider">Ъгъл на отклонение (°):</label>
                        <div class="slider-container">
                            <input type="range" id="angle-slider" min="0" max="90" step="1" value="0">
                            <input type="number" id="angle-input" min="0" max="90" step="1" value="0" class="value-input">
                        </div>
                    </div>                        
                </div>
                <div class="controls-section">
                    <h2>Управление</h2>
                    <div class="buttons-container">
                        <div class="buttons-row">
                            <button id="start-btn">Старт</button>
                            <button id="pause-btn">Пауза</button>
                            <button id="reset-btn">Нулиране</button>
                        </div>
                        <button id="save-btn">Пружинно махало</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="canvas">
            <canvas class="webgl"></canvas>
        </div>
        <div class="graph-container">
            <div class="graph-content">
                <h2>Графика на трептенията</h2>
                <canvas id="chart" width="400" height="200"></canvas>
                <div class="controls-section energy-section">
                    <h2>Енергии</h2>
                    <div class="energy-display">
                        <div class="energy-value">
                            <label>Потенциална енергия:</label>
                            <span id="potential-energy">0.00</span> J
                        </div>
                        <div class="energy-value">
                            <label>Кинетична енергия:</label>
                            <span id="kinetic-energy">0.00</span> J
                        </div>
                        <div class="energy-value total">
                            <label>Обща енергия:</label>
                            <span id="total-energy">0.00</span> J
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <script type="module" src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
