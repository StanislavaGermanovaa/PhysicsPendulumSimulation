<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <title>Резултати от симулацията</title>
    <link rel="stylesheet" href="results.css" />
</head>
<body>
    <div class="title-wrapper">
        <h1>Резултати от симулацията</h1>
    </div>
    <div class="params" id="params"></div>
    <table>
        <thead>
            <tr>
                <th>Време (s)</th>
                <th>Ъгъл (°)</th>
                <th>Потенциална енергия (J)</th>
                <th>Кинетична енергия (J)</th>
                <th>Обща енергия (J)</th>
            </tr>
        </thead>
        <tbody id="results-body"></tbody>
    </table>

   <script>
    const dataStr = localStorage.getItem('pendulumResults');
    if (!dataStr) {
        document.body.innerHTML = '<p style="text-align:center; color:red;">Няма налични резултати за показване.</p>';
        throw new Error('No results data found');
    }
    const data = JSON.parse(dataStr);
    const { timeLabels, angleValues, mass, length } = data;
    const g = 9.81;

    // Попълваме параметрите
    const paramsDiv = document.getElementById('params');
    paramsDiv.innerHTML = `
    <p><strong>Маса на топчето:</strong> ${mass.toFixed(2)} кг</p>
    <p><strong>Дължина на нишката:</strong> ${length.toFixed(2)} м</p>
    <p><strong>Период на трептене:</strong> ${data.period.toFixed(2)} s</p>
`;



    const tbody = document.getElementById('results-body');
    const maxRows = 50; 
    for (let i = 0; i < timeLabels.length; i++) {
        const thetaRad = parseFloat(angleValues[i]) * (Math.PI / 180);
        const height = length * (1 - Math.cos(thetaRad));
        const v = length * ((i > 0 ? (parseFloat(angleValues[i]) - parseFloat(angleValues[i - 1])) / 0.1 : 0) * Math.PI / 180);

        const potentialEnergy = mass * g * height;
        const kineticEnergy = 0.5 * mass * v * v;
        const totalEnergy = potentialEnergy + kineticEnergy;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${timeLabels[i]}</td>
            <td>${angleValues[i]}</td>
            <td>${potentialEnergy.toFixed(2)}</td>
            <td>${kineticEnergy.toFixed(2)}</td>
            <td>${totalEnergy.toFixed(2)}</td>
        `;

        tbody.appendChild(row);

        while (tbody.rows.length > maxRows) {
            tbody.deleteRow(0);
        }
    }
</script>

</body>
</html>
