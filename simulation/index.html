<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулация на Махало</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
          "imports": {
            "three": "./three.js-master/build/three.module.js",
            "three/addons/": "./three.js-master/examples/jsm/",
            "OrbitControls": "./three.js-master/examples/jsm/controls/OrbitControls.js"
          }
        }
    </script>
</head>
<body>
    <div class="header">
        <h1>Симулация на Математично Махало</h1>
    </div>
    <div class="simulation-container">
        <div class="controls-panel">
            <div class="controls-content">
                <div class="controls-section">
                    <h2>Параметри на махалото</h2>
                    <div class="control-group">
                         <label for="mass-slider">
                            Маса на топчето (kg):
                            <span class="info-tooltip">?
                                <span class="tooltip-text">Определя инерцията на махалото. При по-голяма маса се увеличава кинетичната и потенциалната енергия.</span>
                            </span>
                        </label>
                        <div class="slider-container">
                            <input type="range" id="mass-slider" min="0.01" max="1" step="0.01" value="1">
                            <input type="number" id="mass-input" min="0.01" max="1" step="0.01" value="1" class="value-input">
                        </div>
                    </div>
                    <div class="control-group">
                        <label for="length-slider">
                            Дължина на нишката (m):
                            <span class="info-tooltip">?
                                <span class="tooltip-text">Определя периода на махалото. При по-дълга нишка трептенията стават по-бавни. Формула: T = 2π√(L/g)</span>
                            </span>
                        </label>
                        <div class="slider-container">
                            <input type="range" id="length-slider" min="0.5" max="2" step="0.01" value="1.1">
                            <input type="number" id="length-input" min="0.5" max="2" step="0.01" value="1.1" class="value-input">
                        </div>
                    </div>
                    <div class="control-group">
                          <label for="angle-slider">
                                Ъгъл на отклонение (°):
                                <span class="info-tooltip">?
                                    <span class="tooltip-text">Първоначалният ъгъл определя началната енергия и амплитуда. При малки ъгли махалото се доближава до хармонично движение.</span>
                                </span>
                            </label>
                        <div class="slider-container">
                            <input type="range" id="angle-slider" min="0" max="90" step="1" value="0">
                            <input type="number" id="angle-input" min="0" max="90" step="1" value="0" class="value-input">
                        </div>
                    </div>                        
                </div>
                <div class="controls-section">
                    <h2>Управление</h2>
                    <div class="buttons-container">
                        <div class="buttons-row">
                            <button id="start-btn">Старт</button>
                            <button id="pause-btn">Пауза</button>
                            <button id="reset-btn">Нулиране</button>
                        </div>
                        <button id="view-results-btn">Резултати</button>
                        <button id="spring-btn" onclick="location.href='spring-pendulum.html'">Пружинно махало</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="canvas">
            <canvas class="webgl"></canvas>
        </div>

        <div class="graph-container">
            <div class="graph-content">
                <h2>Графика на трептенията</h2>
                <canvas id="chart" width="400" height="200"></canvas>                    
                <div class="diagram-header">
                    <h2>
                        Диаграма на енергиите и периода на трептене: 
                        <span class="info-tooltip">?
                            <span class="tooltip-text">
                                Диаграмата показва енергийното състояние на махалото:
                                <br><strong>Потенциална енергия:</strong> E = mgh
                                <br><strong>Кинетична енергия:</strong> E = ½mv²
                                <br><strong>Обща енергия:</strong> E = Ek + Ep
                                <br><strong>Период:</strong> T = 2π√(L/g)
                            </span>
                        </span>
                    </h2>
                </div>
                <canvas id="energyChart" width="300" height="240"></canvas>
            </div>
        </div>
    <script type="module" src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
